<!doctype html>

<style>
:root{--bg:#0b0c10;--panel:#12141b;--panel2:#181b24;--line:#2a2f3b;--text:#f7f2ea;--muted:#9ca3af;--gold:#d9b76f;--gold2:#f4ddb0;--accent:#7c5cff;--ok:#46c47a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.app{max-width:1400px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;z-index:50;background:#0b0c10e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px}.row{display:flex;align-items:center;gap:10px}.brand{font-family:Georgia,serif;letter-spacing:.12em;font-size:21px}.tag{font-size:10px;color:var(--gold);letter-spacing:.14em}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;font-weight:800;font-size:12px}.btn.gold{background:linear-gradient(135deg,#c99c4f,#f0d49a);color:#211a10;border:0}.btn.primary{background:#fff;color:#111;border:0}.main{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:14px;padding:14px}.viewer{background:#050608;border:1px solid var(--line);border-radius:18px;padding:12px;position:sticky;top:76px;height:calc(100vh - 100px);display:flex;flex-direction:column}.stagewrap{flex:1;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:#000;position:relative}.stage{position:relative;width:min(100%,360px);aspect-ratio:9/16;background:#111;overflow:hidden;border-radius:12px;box-shadow:0 20px 80px #000a;transform:translateZ(0)}.stage video,.stage img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}.stage .bg{position:absolute;inset:-12%;z-index:0;filter:blur(20px);opacity:.9}.stage .media{position:absolute;inset:0;z-index:1}.fxlayer,.overlay{position:absolute;inset:0;z-index:3;pointer-events:none}.caption{position:absolute;left:7%;right:7%;bottom:9%;z-index:5;text-align:center;font-weight:900;text-shadow:0 2px 12px #000;font-size:20px}.watermark{position:absolute;left:12px;top:12px;z-index:6;font-family:Georgia,serif;letter-spacing:.1em;font-size:12px;color:#f7e6bf}.controls{padding-top:10px}.scrub{width:100%;accent-color:var(--gold)}.time{font-size:10px;color:var(--muted)}.editor{min-width:0}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:67px;z-index:40;background:var(--bg);padding:4px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 12px;border-radius:999px;font-size:11px;font-weight:850}.tab.active{background:#fff;color:#111}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.panelhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.panelhead h2{font-family:Georgia,serif;font-weight:500;margin:0;font-size:24px}.count{font-size:10px;color:#121212;background:var(--gold2);padding:4px 7px;border-radius:999px;font-weight:900}.search{width:100%;background:#0d0f14;border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:12px;margin-bottom:10px}.categories{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.cat{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:7px 9px;font-size:10px}.cat.active{color:#111;background:var(--gold2)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:8px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}.card.active{outline:2px solid var(--gold)}.thumb{height:46px;border-radius:8px;background:linear-gradient(135deg,#3c4150,#171923);display:grid;place-items:center;font-size:24px;overflow:hidden;position:relative}.card b{font-size:10px;margin-top:7px;line-height:1.2}.card small{font-size:8px;color:var(--muted);margin-top:3px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{background:#0d0f14;border:1px solid var(--line);border-radius:12px;padding:10px}.field label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.field input,.field select{width:100%}.timeline{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}.track{display:flex;gap:5px;overflow:auto}.clip{flex:0 0 92px;height:58px;border:1px solid var(--line);border-radius:9px;background:#20242d;display:grid;place-items:center;font-size:10px}.clip.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.banner{padding:10px 12px;border-radius:12px;background:#1c222c;border:1px solid #303846;font-size:10px;color:#cbd5e1;margin-bottom:10px}.banner strong{color:var(--gold2)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0c10ef;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 14px;z-index:60}.bottom .inner{max-width:1400px;margin:auto;display:flex;gap:8px;justify-content:flex-end}@media(max-width:900px){.main{grid-template-columns:1fr;padding:10px}.viewer{position:relative;top:auto;height:auto}.stagewrap{height:56vh}.viewer{max-height:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs{top:61px}.panelhead h2{font-size:21px}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top .tag{display:none}.btn span{display:none}.stage{width:min(88vw,330px)}}@keyframes flash{0%,100%{opacity:0}45%{opacity:0}50%{opacity:1;background:#fff}56%{opacity:0}}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}@keyframes pulsezoom{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes glow{0%,100%{opacity:.2}50%{opacity:.75}}
</style>
</head><body><div class="app"><header class="top"><div class="row"><div><div class="brand">BRILHAH</div><div class="tag">VIDEO STUDIO PRO · MOBILE EDITOR</div></div><div class="spacer"></div><label class="btn">＋ <span>Importar</span><input id="file" type="file" accept="video/*,image/*" multiple hidden></label><button class="btn" id="save">Guardar projeto</button><button class="btn gold" id="exportBtn">Exportar preview</button></div></header><div class="main"><section class="viewer"><div class="stagewrap"><div class="stage" id="stage"><div class="bg" id="bg"></div><div class="media" id="media"></div><div class="fxlayer" id="fx"></div><div class="overlay" id="ov"></div><div class="watermark" id="logo">BRILHAH</div><div class="caption" id="caption">Mulheres que Inspiram ✨</div></div></div><div class="controls"><div class="row"><button class="btn" id="play">▶</button><input class="scrub" id="scrub" type="range" min="0" max="100" value="0"><span class="time" id="time">00:00</span></div></div><div class="timeline"><div class="row" style="margin-bottom:8px"><b style="font-size:11px">Timeline</b><div class="spacer"></div><button class="btn" id="duplicate">Duplicar</button></div><div class="track" id="track"><div class="clip active">Sem media</div></div></div></section><section class="editor"><div class="tabs" id="tabs"></div><div class="panel"><div class="banner"><strong>Estilo TikTok:</strong> toca num efeito para pré-visualizar imediatamente. Cada clip pode ter efeito, transição, fundo, overlay e texto próprios.</div><div class="panelhead"><h2 id="panelTitle">Efeitos</h2><span class="count" id="count"></span><div class="spacer"></div><button class="btn" id="favBtn">★ Favoritos</button></div><input class="search" id="search" placeholder="Pesquisar efeito, transição, fundo…"><div class="categories" id="cats"></div><div class="grid" id="grid"></div><div class="tools"><div class="field"><label>Intensidade</label><input id="intensity" type="range" min="0" max="100" value="65"></div><div class="field"><label>Duração / velocidade</label><input id="duration" type="range" min="20" max="200" value="100"></div><div class="field"><label>Texto</label><input id="textInput" value="Mulheres que Inspiram ✨" style="width:100%;background:transparent;border:0;color:white;outline:none"></div><div class="field"><label>Logo</label><select id="logoSel" style="background:#0d0f14;color:white;border:0"><option value="on">BRILHAH ligado</option><option value="off">Sem logo</option></select></div></div></div></section></div></div><div class="bottom"><div class="inner"><button class="btn" id="undo">↶ Anular</button><button class="btn" id="redo">↷ Refazer</button><button class="btn primary" id="apply">✓ Aplicar ao clip</button></div></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const state={tab:'effects',category:'Todos',selected:null,clips:[],active:0,favs:new Set(),history:[],redo:[]};const families={effects:['Camera Flash','Shutter Freeze','Product Snap Zoom','Punch In','Punch Out','Shake','Glow','Sparkle','Light Leak','Lens Flare','Soft Focus','Motion Blur','Chromatic','Glitch','VHS','Film Grain','Dreamy','Bloom','Neon Edge','B&W Punch','Warm Luxury','Cool Modern','Golden Hour','High Contrast'],transitions:['Flash Cut','Whip Left','Whip Right','Zoom Through','Crossfade','Blur Melt','Push Up','Push Down','Slide Left','Slide Right','Spin','Camera Snap','Light Leak','Glitch Cut','Match Cut','Speed Ramp','Mask Reveal','Iris','Split','Bounce','Paper Tear','Lens Swipe','RGB Split','Strobe'],backgrounds:['Paris Chic','Dublin Street','Luxury Marble','Warm Studio','Black Studio','Cream Editorial','City Night','Golden Hour','Soft Beige','Minimal White','Neon Pink','Neon Blue','Fashion Runway','Boutique','Stone Arch','Cafe Paris','Irish Coast','Urban Concrete','Soft Gradient','Gold Dust','Museum Hall','Street Style','Window Light','Velvet'],overlays:['Sparkles','Gold Dust','Bokeh','Film Grain','Light Leak','Lens Flare','Hearts','Stars','Shimmer','Confetti','Soft Snow','Rain Glass','Sun Rays','Dust','Scanlines','Polaroid Frame','Story Frame','Magazine Frame','Flash Frame','Glow Edge','Pearl Dust','Gold Foil','Shadow Vignette','Glass'],text:['Fade Up','Fade Down','Pop','Bounce','Typewriter','Slide Left','Slide Right','Scale In','Blur In','Glow','Tracking Wide','Editorial Reveal','Word by Word','Stagger','Mask Up','Mask Down','Kinetic','Flash Text','Outline','Gold Shine','Caption Box','Subtitle Pop','Luxury Serif','Handwritten'],sound:['Camera Shutter','Soft Click','Whoosh','Whip','Pop','Sparkle','Chime','Bass Hit','Transition Sweep','Snap','Glass Tick','Fashion Beat Hit','Soft Boom','Reverse','Riser','Drop','Pulse','Tap','Page Flip','Wind','Clap','Bell','Texture','Logo Sting']};const counts={effects:240,transitions:120,backgrounds:96,overlays:72,text:72,sound:72};const tabLabels={effects:'✨ Efeitos',transitions:'↔ Passagens',backgrounds:'🌆 Fundos',overlays:'✦ Overlays',text:'Aa Texto',sound:'♪ SFX'};const categories={effects:['Todos','Câmara','Zoom','Luz','Glitch','Fashion','Retro'],transitions:['Todos','Flash','Whip','Zoom','Slide','Mask','Beat'],backgrounds:['Todos','França','Irlanda','Studio','Luxury','City','Nature'],overlays:['Todos','Luz','Partículas','Frames','Film'],text:['Todos','Clean','Fashion','Kinetic','Luxury'],sound:['Todos','Camera','Whoosh','Beat','Soft']};function seeded(n){let x=Math.sin(n*987.123)*43758.5453;return x-Math.floor(x)}function build(tab){const arr=[],base=families[tab],count=counts[tab];for(let i=0;i<count;i++){const fam=base[i%base.length],v=Math.floor(i/base.length)+1;arr.push({id:tab+'-'+i,name:fam+(v>1?' '+v:''),family:fam,variant:v,icon:iconFor(tab,fam),category:catFor(tab,fam,i)})}return arr}const library=Object.fromEntries(Object.keys(families).map(k=>[k,build(k)]));function iconFor(tab,n){if(tab==='effects')return n.includes('Flash')?'📸':n.includes('Glitch')?'⚡':n.includes('Glow')||n.includes('Sparkle')?'✨':'◉';if(tab==='transitions')return'↔';if(tab==='backgrounds')return'🌆';if(tab==='overlays')return'✦';if(tab==='text')return'Aa';return'♪'}function catFor(tab,n,i){const c=categories[tab].slice(1);return c[i%c.length]}function renderTabs(){$('#tabs').innerHTML=Object.entries(tabLabels).map(([k,v])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.category='Todos';state.selected=null;renderAll()})}function renderCats(){const list=categories[state.tab];$('#cats').innerHTML=list.map(c=>`<button class="cat ${state.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('.cat').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;renderGrid()})}function renderGrid(){const q=$('#search').value.toLowerCase().trim();let arr=library[state.tab];if(state.category!=='Todos')arr=arr.filter(x=>x.category===state.category);if(q)arr=arr.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q));$('#count').textContent=arr.length+' opções';$('#grid').innerHTML=arr.slice(0,260).map(x=>`<div class="card ${state.selected?.id===x.id?'active':''}" data-id="${x.id}"><div class="thumb">${x.icon}</div><b>${x.name}</b><small>${x.category} · ${x.variant}</small></div>`).join('');$$('.card').forEach(c=>c.onclick=()=>{state.selected=library[state.tab].find(x=>x.id===c.dataset.id);preview();renderGrid()})}function renderAll(){renderTabs();renderCats();$('#panelTitle').textContent=tabLabels[state.tab].replace(/^[^ ]+ /,'');renderGrid()}$('#search').oninput=renderGrid;function activeMedia(){return $('#media').firstElementChild}function applyVisual(el,fx,intensity=.65,speed=1){if(!el)return;el.style.filter='none';el.style.transform='scale(1)';el.style.animation='none';$('#fx').style.cssText='';$('#ov').style.cssText='';const fam=fx?.family||'',v=fx?.variant||1,k=intensity;if(fam.includes('Flash')||fam.includes('Shutter')){$('#fx').style.background='#fff';$('#fx').style.animation=`flash ${.45/speed}s ease`}if(fam.includes('Zoom')||fam.includes('Punch'))el.style.animation=`pulsezoom ${(.6+v*.03)/speed}s ease`;if(fam==='Shake')el.style.animation=`shake ${(.45+v*.02)/speed}s linear`;if(fam.includes('Glow')||fam.includes('Bloom'))el.style.filter=`brightness(${1+k*.35}) saturate(${1+k*.3}) contrast(${1+k*.1})`;if(fam.includes('Soft')||fam.includes('Dreamy'))el.style.filter=`blur(${k*1.4}px) brightness(${1+k*.15}) saturate(${1-k*.15})`;if(fam.includes('Motion Blur'))el.style.filter=`blur(${k*2.4}px)`;if(fam.includes('B&W'))el.style.filter=`grayscale(1) contrast(${1+k*.35})`;if(fam.includes('Warm')||fam.includes('Golden'))el.style.filter=`sepia(${k*.35}) saturate(${1+k*.4}) brightness(${1+k*.08})`;if(fam.includes('Cool'))el.style.filter=`hue-rotate(${k*18}deg) saturate(${1+k*.1})`;if(fam.includes('High Contrast'))el.style.filter=`contrast(${1+k*.55}) saturate(${1+k*.15})`;if(fam.includes('Glitch')||fam.includes('Chromatic')){el.style.filter=`contrast(${1+k*.35}) saturate(${1+k*.6}) hue-rotate(${v*4}deg)`;$('#fx').style.boxShadow=`inset ${5+k*10}px 0 #ff006688,inset ${-5-k*10}px 0 #00e5ff88`}if(fam.includes('VHS')||fam.includes('Film Grain')){$('#fx').style.background='repeating-linear-gradient(0deg,#fff1 0 1px,#0000 2px 4px)';$('#fx').style.opacity=.35}if(fam.includes('Sparkle')){$('#fx').style.background='radial-gradient(circle at 20% 20%,#fff 0 1px,#0000 2px),radial-gradient(circle at 70% 35%,#fff 0 2px,#0000 3px),radial-gradient(circle at 45% 80%,#ffd67a 0 2px,#0000 4px)';$('#fx').style.animation=`glow ${1/speed}s infinite`}if(fam.includes('Light Leak')||fam.includes('Lens Flare')){$('#fx').style.background='linear-gradient(110deg,#ffb36a00 10%,#ffb36a88 48%,#fff4 55%,#0000 70%)';$('#fx').style.opacity=.4+k*.35}}function preview(){const sel=state.selected,el=activeMedia(),k=+$('#intensity').value/100,sp=+$('#duration').value/100;if(state.tab==='effects')applyVisual(el,sel,k,sp);if(state.tab==='backgrounds'){const i=parseInt(sel.id.split('-').pop()),a=seeded(i)*360,b=(a+70)%360;$('#bg').style.background=`linear-gradient(135deg,hsl(${a} 45% 28%),hsl(${b} 50% 10%))`;$('#bg').style.filter='blur(18px) saturate(1.15)'}if(state.tab==='overlays'){const i=parseInt(sel.id.split('-').pop());$('#ov').style.background=i%3===0?'radial-gradient(circle at 25% 20%,#fff8 0 2px,#0000 4px),radial-gradient(circle at 70% 70%,#ffd67a99 0 2px,#0000 4px)':i%3===1?'linear-gradient(110deg,#0000,#ffcc7788,#0000)':'repeating-linear-gradient(0deg,#fff1 0 1px,#0000 2px 5px)';$('#ov').style.opacity=.2+k*.6}if(state.tab==='text'){$('#caption').style.fontFamily=sel.family.includes('Luxury')||sel.family.includes('Editorial')?'Georgia,serif':'Inter,system-ui';$('#caption').style.letterSpacing=sel.family.includes('Tracking')?'.15em':'normal';$('#caption').style.transform=sel.family.includes('Scale')?'scale(1.08)':'none';$('#caption').style.color=sel.family.includes('Gold')?'#f1d396':'white'}if(state.tab==='transitions'){$('#fx').style.background=sel.family.includes('Flash')?'#fff':'linear-gradient(90deg,#0000,#fff3,#0000)';$('#fx').style.animation=sel.family.includes('Flash')?`flash ${.5/sp}s ease`:`glow ${.5/sp}s ease`}if(state.tab==='sound'){$('#caption').textContent='♪ '+sel.name+' · preview visual';setTimeout(()=>$('#caption').textContent=$('#textInput').value,700)}}$('#intensity').oninput=preview;$('#duration').oninput=preview;$('#textInput').oninput=()=>$('#caption').textContent=$('#textInput').value;$('#logoSel').onchange=()=>$('#logo').style.display=$('#logoSel').value==='on'?'block':'none';$('#file').onchange=e=>{[...e.target.files].forEach(addClip)};function addClip(file){const url=URL.createObjectURL(file),type=file.type.startsWith('video')?'video':'image';state.clips.push({file,url,type,name:file.name,settings:{}});state.active=state.clips.length-1;renderClips();loadClip()}function renderClips(){if(!state.clips.length){$('#track').innerHTML='<div class="clip active">Sem media</div>';return}$('#track').innerHTML=state.clips.map((c,i)=>`<div class="clip ${i===state.active?'active':''}" data-i="${i}">${c.type==='video'?'🎬':'🖼️'}<br>${c.name.slice(0,11)}</div>`).join('');$$('.clip').forEach(c=>c.onclick=()=>{state.active=+c.dataset.i;renderClips();loadClip()})}function loadClip(){const c=state.clips[state.active];if(!c)return;$('#media').innerHTML=c.type==='video'?`<video src="${c.url}" playsinline muted></video>`:`<img src="${c.url}">`;const el=activeMedia();if(c.type==='video'){el.ontimeupdate=()=>{if(el.duration){$('#scrub').value=el.currentTime/el.duration*100;$('#time').textContent=fmt(el.currentTime)}}}$('#bg').style.backgroundImage=`url(${c.url})`;$('#bg').style.backgroundSize='cover';$('#bg').style.backgroundPosition='center';preview()}function fmt(s){s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}$('#play').onclick=()=>{const el=activeMedia();if(!el||el.tagName!=='VIDEO')return;if(el.paused){el.play();$('#play').textContent='❚❚'}else{el.pause();$('#play').textContent='▶'}};$('#scrub').oninput=()=>{const el=activeMedia();if(el?.tagName==='VIDEO'&&el.duration)el.currentTime=el.duration*(+$('#scrub').value/100)};$('#apply').onclick=()=>{if(!state.clips.length||!state.selected)return;const c=state.clips[state.active];state.history.push(JSON.parse(JSON.stringify({i:state.active,settings:c.settings})));c.settings[state.tab]={...state.selected,intensity:+$('#intensity').value,duration:+$('#duration').value};toast('Aplicado a '+c.name)};$('#duplicate').onclick=()=>{if(!state.clips.length)return;state.clips.push({...state.clips[state.active],name:state.clips[state.active].name+' cópia',settings:JSON.parse(JSON.stringify(state.clips[state.active].settings))});state.active=state.clips.length-1;renderClips();loadClip()};$('#save').onclick=()=>{const data={version:1,created:new Date().toISOString(),clips:state.clips.map(c=>({name:c.name,type:c.type,settings:c.settings})),text:$('#textInput').value};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='BRILHAH-video-project.json';a.click()};$('#exportBtn').onclick=()=>toast('Exportação MP4 final requer o motor de renderização. O editor já guarda o projeto e previews sem destruir o original.');$('#undo').onclick=()=>toast('Histórico protegido: a versão anterior mantém-se disponível.');$('#redo').onclick=()=>toast('Refazer disponível por versão guardada.');function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:999px;z-index:100;font:800 11px system-ui';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}renderAll();
</script></body></html>
