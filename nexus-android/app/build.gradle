plugins { id 'com.android.application' }

android {
    namespace 'pt.nexus.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.nexus.assistant'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
android { defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' } }
dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }

dependencies { implementation "com.google.mediapipe:tasks-vision:0.10.21"; testImplementation "junit:junit:4.13.2" }
