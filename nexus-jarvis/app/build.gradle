plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.nexus.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.nexus.jarvis.sms'
        minSdk 26
        targetSdk 34
        versionCode 153
        versionName '1.5.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}