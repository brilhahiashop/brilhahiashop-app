plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.nexus.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.nexus.jarvis.mail'
        minSdk 26
        targetSdk 34
        versionCode 170
        versionName '1.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
