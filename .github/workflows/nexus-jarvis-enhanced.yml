name: NEXUS JARVIS 1.4 holographic APK
on:
  push:
    branches: [nexus-jarvis-enhanced]
    paths: ['nexus-jarvis/**', '.github/workflows/nexus-jarvis-enhanced.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-jarvis-v1.4
  cancel-in-progress: true
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: JavaScript syntax and voice command tests
        run: |
          node --check nexus-jarvis/app/src/main/assets/hud-upgrade.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('nexus-jarvis/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',h,flags=re.I|re.S)
          assert scripts, 'Missing JavaScript'
          Path('/tmp/nexus-jarvis-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/nexus-jarvis-inline.js
          node --test nexus-jarvis/tests/command-regression.test.cjs
      - name: Compile Android and run lint
        run: gradle -p nexus-jarvis :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Prepare APK and SHA256
        run: |
          cp nexus-jarvis/app/build/outputs/apk/debug/app-debug.apk NEXUS-JARVIS-Android-v1.4.0.apk
          sha256sum NEXUS-JARVIS-Android-v1.4.0.apk > SHA256SUMS-JARVIS-1.4.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-JARVIS-APK-v1.4.0
          path: |
            NEXUS-JARVIS-Android-v1.4.0.apk
            SHA256SUMS-JARVIS-1.4.txt
          if-no-files-found: error
      - name: Publish prerelease after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nexus-jarvis-v1.4.0 NEXUS-JARVIS-Android-v1.4.0.apk SHA256SUMS-JARVIS-1.4.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "NEXUS JARVIS Android 1.4.0 - holographic HUD and security" \
            --notes "Versao beta independente: HUD holografico interativo, atalhos, apps instaladas, TTS com progresso sincronizado, energia do microfone, saudacao inicial, tokens AES-256-GCM no Android Keystore. Inclui comandos e Shopify read-only da v1.3. Compilacao, Android lint, sintaxe JS e testes de comandos executados. Ainda nao foi testado num telemovel fisico. Escuta apenas com a app aberta, sem servico continuo em segundo plano. APK debug-signed."
