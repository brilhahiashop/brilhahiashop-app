name: NEXUS JARVIS 1.5.3 SMS alongside APK
on:
  push:
    branches: [nexus-jarvis-sms]
    paths: ['nexus-jarvis/**', '.github/workflows/nexus-jarvis-enhanced.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-jarvis-v1.5.3
  cancel-in-progress: true
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: JavaScript syntax and voice command tests
        run: |
          node --check nexus-jarvis/app/src/main/assets/hud-upgrade.js
          node --check nexus-jarvis/app/src/main/assets/human-face.js
          node --check nexus-jarvis/app/src/main/assets/jarvis-operator.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('nexus-jarvis/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',h,flags=re.I|re.S)
          assert scripts, 'Missing JavaScript'
          Path('/tmp/nexus-jarvis-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/nexus-jarvis-inline.js
          node --test nexus-jarvis/tests/command-regression.test.cjs nexus-jarvis/tests/voice-actions.test.cjs
      - name: Compile Android and run lint
        run: gradle -p nexus-jarvis :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Prepare APK and SHA256
        run: |
          cp nexus-jarvis/app/build/outputs/apk/debug/app-debug.apk NEXUS-JARVIS-SMS-v1.5.3-instalar-ao-lado.apk
          sha256sum NEXUS-JARVIS-SMS-v1.5.3-instalar-ao-lado.apk > SHA256SUMS-JARVIS-1.5.3.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-JARVIS-APK-v1.5.3
          path: |
            NEXUS-JARVIS-SMS-v1.5.3-instalar-ao-lado.apk
            SHA256SUMS-JARVIS-1.5.3.txt
          if-no-files-found: error
      - name: Publish prerelease after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nexus-jarvis-v1.5.3 NEXUS-JARVIS-SMS-v1.5.3-instalar-ao-lado.apk SHA256SUMS-JARVIS-1.5.3.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "NEXUS JARVIS SMS 1.5.3 - installs alongside 1.5.1" \
            --notes "VERSAO PARA INSTALAR AO LADO: identificador pt.nexus.jarvis.sms e nome NEXUS JARVIS SMS; preserva a instalacao 1.5.1 e respetivos dados, mas exige voltar a associar os contactos nesta nova app. NEXUS JARVIS 1.5.3 beta: mensagens genéricas passam a SMS por defeito, WhatsApp apenas quando explicitamente pedido. SMS nativo com confirmação no ecrã, permissão SEND_SMS e retorno de estado da rede; quando a permissão é bloqueada, abre Mensagens com rascunho para enviar manualmente. Mantém chamadas por alcunha, ditado, lembretes, pesquisa com fontes e avatar humanoide. Abertura do SMS sem texto após pedido de envio evita duplicação. Compilado com Android Lint e testes de comandos. SEND_SMS pode ser restringida pelo Android/instalador. Envio efetivo e motor de voz por testar em telemóvel físico. Versao de testes debug-signed."
