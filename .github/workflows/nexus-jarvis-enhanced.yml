name: NEXUS JARVIS 1.5.1 humanoid APK
on:
  push:
    branches: [nexus-jarvis-enhanced]
    paths: ['nexus-jarvis/**', '.github/workflows/nexus-jarvis-enhanced.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-jarvis-v1.5.1
  cancel-in-progress: true
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: JavaScript syntax and voice command tests
        run: |
          node --check nexus-jarvis/app/src/main/assets/hud-upgrade.js
          node --check nexus-jarvis/app/src/main/assets/human-face.js
          node --check nexus-jarvis/app/src/main/assets/jarvis-operator.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('nexus-jarvis/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',h,flags=re.I|re.S)
          assert scripts, 'Missing JavaScript'
          Path('/tmp/nexus-jarvis-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/nexus-jarvis-inline.js
          node --test nexus-jarvis/tests/command-regression.test.cjs nexus-jarvis/tests/voice-actions.test.cjs
      - name: Compile Android and run lint
        run: gradle -p nexus-jarvis :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Prepare APK and SHA256
        run: |
          cp nexus-jarvis/app/build/outputs/apk/debug/app-debug.apk NEXUS-JARVIS-Android-v1.5.1.apk
          sha256sum NEXUS-JARVIS-Android-v1.5.1.apk > SHA256SUMS-JARVIS-1.5.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-JARVIS-APK-v1.5.1
          path: |
            NEXUS-JARVIS-Android-v1.5.1.apk
            SHA256SUMS-JARVIS-1.5.txt
          if-no-files-found: error
      - name: Publish prerelease after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nexus-jarvis-v1.5.1 NEXUS-JARVIS-Android-v1.5.1.apk SHA256SUMS-JARVIS-1.5.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "NEXUS JARVIS Android 1.5.1 - human avatar and multi-action assistant" \
            --notes "Beta 1.5: avatar humano com movimentos aproximados dos labios ligados a eventos TTS, voz pt-PT selecionavel, chamada por nome com associacao de alcunhas, composicao de WhatsApp/SMS com confirmacao de envio, lembretes locais, pesquisa multi-fonte com fontes reais e comandos por voz encadeados ate 4 passos (passos externos exigem continuar). Mantem app pt.nexus.jarvis e tokens cifrados por Android Keystore. Compilacao, Lint e testes de interpretacao executados em CI. NAO significa controlo universal de todas as apps, envio automatico no WhatsApp, lipsync cinematografico, pesquisa de toda a Web ou testes em dispositivo fisico. APK debug-signed."
