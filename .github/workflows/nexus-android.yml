name: Compilar NEXUS Android (APK)
on:
  push:
    branches: [nexus-android-release]
    paths:
      - 'nexus-android/**'
      - '.github/workflows/nexus-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar código do NEXUS
        run: |
          base64 -d nexus-android/project.zip.b64 > /tmp/nexus-project.zip
          unzip -oq /tmp/nexus-project.zip -d nexus-android
          python3 nexus-android/patch-privacy.py
      - name: Build debug APK
        run: gradle -p nexus-android :app:assembleDebug --stacktrace --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-APK
          path: nexus-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar APK descarregável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nexus-android/app/build/outputs/apk/debug/app-debug.apk NEXUS-Android-v0.3.1.apk
          if gh release view "nexus-android-v0.3.1" >/dev/null 2>&1; then
            gh release upload "nexus-android-v0.3.1" NEXUS-Android-v0.3.1.apk --clobber
          else
            gh release create "nexus-android-v0.3.1" NEXUS-Android-v0.3.1.apk --target "${GITHUB_SHA}" \
              --title "NEXUS Android v0.3.1" --notes "APK de teste: botão Sair desliga áudio, captura e painel flutuante; ao minimizar também pára microfone e câmara; ao remover dos recentes desativa serviço. Botão WEB para quando o ecrã integrado falhar."
          fi
