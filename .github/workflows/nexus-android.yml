name: NEXUS Android build and offline validation
on:
  push:
    branches: [nexus-android-release]
    paths: ['nexus-android/**', '.github/workflows/nexus-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-android-release
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint
        run: gradle -p nexus-android :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android interface test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p nexus-android :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-validation-reports
          path: nexus-android/app/build/reports
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nexus-android/app/build/outputs/apk/debug/app-debug.apk NEXUS-Android-v0.4.0.apk
          sha256sum NEXUS-Android-v0.4.0.apk > SHA256SUMS.txt
          gh release create nexus-android-v0.4.0 NEXUS-Android-v0.4.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "NEXUS Android 0.4.0 — interface local e voz nativa" --notes-file nexus-android/RELEASE.md
